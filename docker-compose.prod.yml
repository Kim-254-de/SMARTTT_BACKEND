services:
  db:
    image: postgres:15-alpine
    container_name: smarttt_prod_db
    restart: always
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-smarttt_db}
      - POSTGRES_USER=${POSTGRES_USER:-smarttt_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Database password is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smarttt_user} -d ${POSTGRES_DB:-smarttt_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - smarttt_internal_net

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smarttt_prod_web
    restart: always
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - DJANGO_SETTINGS_MODULE=config.settings.production
    volumes:
      - static_prod_volume:/app/staticfiles
      - media_prod_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    networks:
      - smarttt_internal_net

  nginx:
    image: nginx:alpine
    container_name: smarttt_prod_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_prod_volume:/app/staticfiles:ro
      - media_prod_volume:/app/media:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - web
    networks:
      - smarttt_internal_net

  certbot:
    image: certbot/certbot:latest
    container_name: smarttt_prod_certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - smarttt_internal_net

volumes:
  postgres_prod_data:
  static_prod_volume:
  media_prod_volume:

networks:
  smarttt_internal_net:
    driver: bridge
