services:
  db:
    image: postgres:15-alpine
    container_name: smarttt_prod_db
    restart: always
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-smarttt_db}
      - POSTGRES_USER=${POSTGRES_USER:-smarttt_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Database password is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smarttt_user} -d ${POSTGRES_DB:-smarttt_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - smarttt_internal_net

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smarttt_prod_web
    restart: always
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - DJANGO_SETTINGS_MODULE=config.settings.production
    volumes:
      - static_prod_volume:/app/staticfiles
      - media_prod_volume:/app/media
    ports:
      # Expose to VPS localhost so host Nginx can reverse-proxy to it
      - "127.0.0.1:8001:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - smarttt_internal_net

volumes:
  postgres_prod_data:
  static_prod_volume:
  media_prod_volume:

networks:
  smarttt_internal_net:
    driver: bridge
