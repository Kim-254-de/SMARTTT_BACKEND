services:
  db:
    image: postgres:15-alpine
    container_name: smarttt_dev_db
    restart: unless-stopped
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=smarttt_db
      - POSTGRES_USER=smarttt_user
      - POSTGRES_PASSWORD=smarttt_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smarttt_user -d smarttt_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smarttt_dev_web
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - DJANGO_SECRET_KEY=dev-secret-key-smarttt-local-testing-only
      - DJANGO_DEBUG=True
      - DJANGO_ALLOWED_HOSTS=*
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=smarttt_db
      - POSTGRES_USER=smarttt_user
      - POSTGRES_PASSWORD=smarttt_password
      - CORS_ALLOW_ALL_ORIGINS=True
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_dev_data:
  static_volume:
  media_volume: